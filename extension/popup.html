<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        color: #0f172a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 8px 0 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #475569;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #475569;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Gold Adam CRM Sync</h1>
    <div id="signedin" style="display: none">
      <div id="who"></div>
      <button id="logout" class="secondary">Sign out</button>
    </div>
    <div id="signin">
      <label>CRM URL</label>
      <input id="crmUrl" placeholder="http://localhost:3000" />
      <label>Email</label>
      <input id="email" type="email" />
      <label>Password</label>
      <input id="password" type="password" />
      <button id="login">Sign in</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
